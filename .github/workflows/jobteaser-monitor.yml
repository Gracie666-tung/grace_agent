name: jobteaser-monitor

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 巴黎 07:00/08:00（GitHub cron 熱門時段可能延遲 10-20 分鐘）
  workflow_dispatch:
    inputs:
      max_pages:
        description: "最多抓幾頁列表（留空用 jobteaser_config.json 的預設）"
        required: false
        default: ""

concurrency:
  group: jobteaser-monitor # 避免兩輪同時改 data/seen_jobteaser.json
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 執行後要把 data/seen_jobteaser.json 提交回 repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests # 本工具只依賴 requests

      - name: Fetch, score and notify
        env:
          JOBTEASER_COOKIE: ${{ secrets.JOBTEASER_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: |
          python src/jobteaser_monitor.py --max-pages "${MAX_PAGES:-0}"

      - name: Persist seen jobs
        if: always() # 就算上一步中途失敗，已推播的職缺也要記下來，避免明天重複推
        run: |
          git config user.name "jobteaser-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobteaser.json
          git diff --cached --quiet || git commit -m "chore: update seen jobteaser [skip ci]"
          git pull --rebase # 先 commit 再 rebase，避免 dirty tree；其他 workflow 也會 commit
          git push
