name: stock-advisor

on:
  schedule:
    - cron: "30 0 * * 1-5" # 00:30 UTC = 08:30 台北，盤前（GitHub cron 熱門時段可能延遲 10-20 分鐘）
    - cron: "30 6 * * 1-5" # 06:30 UTC = 14:30 台北，收盤後
  workflow_dispatch:
    inputs:
      mode:
        description: "pre=盤前, close=收盤後"
        required: true
        default: "close"
        type: choice
        options: [pre, close]

jobs:
  advise:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 執行後要把 data/stock_state.json 提交回 repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 3 ]; then
            echo "mode=pre" >> "$GITHUB_OUTPUT"   # 00:30 UTC 排程 → 盤前
          else
            echo "mode=close" >> "$GITHUB_OUTPUT" # 06:30 UTC 排程 → 收盤後
          fi

      - name: Analyze and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/stock_advisor.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Persist stock state
        run: |
          git config user.name "stock-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stock_state.json
          git diff --cached --quiet || git commit -m "chore: update stock state [skip ci]"
          git pull --rebase # 先 commit 再 rebase，避免 dirty tree；同日多場 workflow 都會 commit
          git push
